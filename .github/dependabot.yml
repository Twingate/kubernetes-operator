version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: daily
      time: "13:00"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore: "
    groups:
      # Collapse the dev toolchain into a single PR. Runtime dependencies are
      # deliberately left ungrouped so they stay individually reviewable.
      dev-dependencies:
        patterns:
          - "bandit"
          - "factory-boy"
          - "mypy"
          - "pre-commit"
          - "pytest*"
          - "pyupgrade"
          - "responses"
          - "ruff"
          - "syrupy"
          - "types-*"

  - package-ecosystem: pre-commit
    directory: "/"
    schedule:
      interval: daily
      time: "13:00"
    commit-message:
      prefix: "chore: "

  - package-ecosystem: helm
    directory: "deploy/twingate-operator"
    schedule:
      interval: daily
      time: "13:00"
    commit-message:
      prefix: "chore: "
    cooldown:
      exclude:
        - gateway

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: daily
      time: "13:00"
    commit-message:
      prefix: "chore: "
