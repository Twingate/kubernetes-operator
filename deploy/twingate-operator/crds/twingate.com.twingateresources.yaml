apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: twingateresources.twingate.com
spec:
  group: twingate.com
  versions:
    - name: v1beta
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          description: "TwingateResource represents a resource in Twingate."
          required: ["spec"]
          properties:
            spec:
              type: object
              description: "TwingateResourceSpec defines the desired state of TwingateResource"
              x-kubernetes-validations:
                - rule: (self.isBrowserShortcutEnabled && !(self.address.contains('*') || self.address.contains('?'))) || (self.isBrowserShortcutEnabled == false)
                  message: "if isBrowserShortcutEnabled is set to true, then address can't be wildcard"
                - rule: (self.type == "Network" && !has(self.gatewayRef)) || (self.type != "Network" && has(self.gatewayRef))
                  message: "Kubernetes, WebApp and PostgreSQL Resources require gatewayRef; Network Resources do not allow it"
                - rule: ((self.type == "WebApp" || self.type == "PostgreSQL") && has(self.downstream) && has(self.upstream)) || (self.type != "WebApp" && self.type != "PostgreSQL" && !has(self.downstream) && !has(self.upstream))
                  message: "WebApp and PostgreSQL Resources require downstream and upstream; other Resource types allow neither"
                - rule: (self.type == "PostgreSQL") == has(self.auths)
                  message: "PostgreSQL Resource requires auths; other Resource types do not allow it"
                - rule: '!has(self.database) || self.type == "PostgreSQL"'
                  message: "database can only be set for PostgreSQL Resources"
                - rule: self.type != "PostgreSQL" || !(self.address.contains('*') || self.address.contains('?') || self.address.contains('/'))
                  message: "PostgreSQL Resource address can't be a wildcard or a CIDR range"
                - rule: self.type != "PostgreSQL" || !has(self.downstream) || self.downstream.tlsMode == "NONE"
                  message: "PostgreSQL Resource does not support downstream TLS"
                - rule: self.type != "PostgreSQL" || !has(self.auths) || !has(self.upstream) || !self.auths.exists(a, has(a.awsIam) || has(a.gcpIam)) || self.upstream.tlsMode in ["VERIFY_FULL", "VERIFY_CA"]
                  message: "awsIam and gcpIam auth require upstream.tlsMode VERIFY_FULL or VERIFY_CA"
                - rule: '!has(self.requestHeaderRewrites) || self.type == "WebApp"'
                  message: "requestHeaderRewrites can only be set for WebApp Resources"
                - rule: '!has(self.protocols) || self.type == "Network"'
                  message: "protocols can only be set for Network Resources"
                - rule: (self.isBrowserShortcutEnabled && self.type == "Network") || (self.isBrowserShortcutEnabled == false)
                  message: "isBrowserShortcutEnabled can only be set to true for Network Resources"
                - rule: (!has(oldSelf.remoteNetworkId) || self.remoteNetworkId == oldSelf.remoteNetworkId)
                  message: "remoteNetworkId is immutable once set"
              required: ["name", "address"]
              properties:
                id:
                  type: string
                  nullable: true
                name:
                  type: string
                  description: "Name of the resource."
                address:
                  type: string
                  description: "Address of the resource."
                alias:
                  type: string
                  nullable: true
                  description: "Alias of the resource."
                isBrowserShortcutEnabled:
                  type: boolean
                  default: false
                  description: "isBrowserShortcutEnabled specifies whether the resource will display a browser shortcut in the Twingate client."
                remoteNetworkId:
                  type: string
                  pattern: "^[-A-Za-z0-9+/]*={0,3}$"
                  description: "ID of the Twingate Remote Network this Resource belongs to. Overrides the operator-wide default (TWINGATE_REMOTE_NETWORK_ID). Immutable once set."
                securityPolicyId:
                  type: string
                  nullable: true
                  pattern: "^[-A-Za-z0-9+/]*={0,3}$"
                isVisible:
                  type: boolean
                  default: true
                  description: "isVisible specifies whether the resource will display in the main resources list in the Twingate client."
                protocols:
                  type: object
                  nullable: true
                  description: "protocols specifies the resource's protocol policies. Only allowed for Network Resources."
                  properties:
                    allowIcmp:
                      type: boolean
                      nullable: true
                      description: "allowIcmp specifies whether the resource will allow ICMP traffic."
                    tcp:
                      type: object
                      nullable: true
                      description: "tcp specifies the resource's TCP protocol policy."
                      x-kubernetes-validations:
                        - rule: (self.policy == "ALLOW_ALL" && size(self.ports) == 0) || (self.policy == "RESTRICTED")
                          message: "Can't specify port ranges for ALLOW_ALL policy."
                      properties:
                         policy:
                           type: string
                           nullable: true
                           enum:
                             - ALLOW_ALL
                             - RESTRICTED
                         ports:
                           type: array
                           default: []
                           items:
                             type: object
                             x-kubernetes-validations:
                               - rule: (self.start <= self.end)
                                 message: "Start port value must be less or equal to end port value"
                             properties:
                               start:
                                 type: integer
                                 minimum: 1
                                 maximum: 65535
                               end:
                                 type: integer
                                 minimum: 1
                                 maximum: 65535
                    udp:
                      type: object
                      nullable: true
                      description: "udp specifies the resource's UDP protocol policy."
                      x-kubernetes-validations:
                        - rule: (self.policy == "ALLOW_ALL" && size(self.ports) == 0) || (self.policy == "RESTRICTED")
                          message: "Can't specify port ranges for ALLOW_ALL policy."
                      properties:
                         policy:
                           type: string
                           nullable: true
                           enum:
                             - ALLOW_ALL
                             - RESTRICTED
                         ports:
                           type: array
                           default: []
                           items:
                             type: object
                             x-kubernetes-validations:
                               - rule: (self.start <= self.end)
                                 message: "Start port value must be less or equal to end port value"
                             properties:
                               start:
                                 type: integer
                                 minimum: 1
                                 maximum: 65535
                               end:
                                 type: integer
                                 minimum: 1
                                 maximum: 65535
                syncLabels:
                  type: boolean
                  default: true
                  description: "syncLabels specifies whether the resource should sync the metadata labels as resource tags in the Twingate client."
                type:
                  type: string
                  description: "The resource type"
                  default: Network
                  enum:
                    - Network
                    - Kubernetes
                    - WebApp
                    - PostgreSQL
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: "Resource type is immutable"
                gatewayRef:
                  type: object
                  required: ["name"]
                  description: "Reference to the TwingateGateway this Kubernetes, WebApp or PostgreSQL Resource is served by."
                  properties:
                    name:
                      type: string
                      description: "Name of the TwingateGateway object."
                    namespace:
                      type: string
                      nullable: true
                      description: "Namespace of the TwingateGateway object. Defaults to the TwingateResource's own namespace when omitted."
                downstream:
                  type: object
                  required: ["port"]
                  description: "Downstream (client-facing) configuration for a WebApp or PostgreSQL Resource."
                  properties:
                    port:
                      type: integer
                      minimum: 1
                      maximum: 65535
                      description: "The downstream port."
                    tlsMode:
                      type: string
                      enum: ["TLS13", "NONE"]
                      default: "NONE"
                      description: "TLS mode for the downstream (client-facing) connection. TLS is not supported for PostgreSQL Resource."
                upstream:
                  type: object
                  required: ["port"]
                  description: "Upstream (target) configuration for a WebApp or PostgreSQL Resource."
                  properties:
                    port:
                      type: integer
                      minimum: 1
                      maximum: 65535
                      description: "The upstream port."
                    tlsMode:
                      type: string
                      enum: ["VERIFY_FULL", "VERIFY_CA", "INSECURE", "NONE"]
                      default: "NONE"
                      description: "TLS mode for the upstream (target) connection."
                requestHeaderRewrites:
                  type: array
                  description: "HTTP headers to rewrite on requests to the upstream of a WebApp Resource."
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: ["name"]
                  items:
                    type: object
                    required: ["name", "value"]
                    properties:
                      name:
                        type: string
                        description: "The header name."
                      value:
                        type: string
                        description: "The header value."
                database:
                  type: string
                  minLength: 1
                  description: "The default database in the connection string of a PostgreSQL Resource. Defaults to postgres when omitted."
                auths:
                  type: array
                  minItems: 1
                  description: "The authentication method used by Gateway to login to the PostgreSQL resource. At least one entry is required."
                  items:
                    type: object
                    description: "Exactly one of password, awsIam or gcpIam."
                    minProperties: 1
                    maxProperties: 1
                    properties:
                      password:
                        type: object
                        required: ["user", "credential"]
                        properties:
                          user:
                            type: string
                            minLength: 1
                            description: "The database user."
                          credential:
                            type: string
                            minLength: 1
                            description: "The name of a credential defined in the Gateway configuration."
                      awsIam:
                        type: object
                        required: ["user", "region"]
                        properties:
                          user:
                            type: string
                            minLength: 1
                            description: "The database user."
                          region:
                            type: string
                            minLength: 1
                            description: "The AWS region of the database."
                          assumeRoleArn:
                            type: string
                            minLength: 1
                            description: "The ARN of an IAM role the Gateway assumes before it signs the auth token."
                      gcpIam:
                        type: object
                        required: ["impersonateServiceAccount"]
                        properties:
                          impersonateServiceAccount:
                            type: string
                            pattern: '^.+\.gserviceaccount\.com$'
                            description: "The email of the GCP service account the Gateway impersonates when logging in. The database user is derived from it."
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
      additionalPrinterColumns:
        - name: ID
          type: string
          description: "The ID of the resource."
          jsonPath: .spec.id
        - name: Display Name
          type: string
          description: "Name of the resource."
          jsonPath: .spec.name
        - name: Type
          type: string
          description: "Type of the resource."
          jsonPath: .spec.type
        - name: Address
          type: string
          description: "Address of the resource."
          jsonPath: .spec.address
        - name: Alias
          type: string
          description: "Alias of the resource."
          jsonPath: .spec.alias
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
  scope: Namespaced
  names:
    plural: twingateresources
    singular: twingateresource
    kind: TwingateResource
    shortNames:
      - tgr
      - tres
    categories:
      - all
      - twingate
