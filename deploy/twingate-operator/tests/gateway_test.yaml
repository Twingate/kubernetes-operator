suite: Gateway
templates:
  - charts/gateway/templates/*.yaml
set:
  twingateOperator:
    network: <network slug>
    apiKey: <api key>
    remoteNetworkId: <remote network id>
tests:
  - it: should enable Gateway
    # Hardcode the chart version and app version to ensure that the snapshot is stable
    # when upgrading Gateway subchart
    chart:
      version: 1.0.0
      appVersion: 1.0.0
    set:
      gateway:
        enabled: true
        twingate:
          network: <network slug>
        tls:
          autoGenerated: false
          cert: <tls cert>
          key: <tls key>
          ca: <ca cert>
    # The subchart derives the Certificate Authority name from the kube-system namespace
    # UID, unreadable without a cluster. Same UID as the subchart's own tests.
    kubernetesProvider:
      scheme:
        "v1/Namespace":
          gvr:
            version: "v1"
            resource: "namespaces"
          namespaced: false
      objects:
        - kind: Namespace
          apiVersion: v1
          metadata:
            name: kube-system
            uid: 11111111-2222-3333-4444-555555555555
    asserts:
      - matchSnapshot: {}
