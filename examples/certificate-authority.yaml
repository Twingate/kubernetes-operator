apiVersion: twingate.com/v1beta
kind: TwingateCertificateAuthority
metadata:
  name: example-ca
spec:
  name: Example Gateway CA
  type: X509
  # Exactly one of `secretRef` or `configMapRef` names the object whose `ca.crt`
  # is registered with Twingate as the X509 CA. Both are immutable, and the choice
  # between them cannot be changed after creation.
  secretRef:
    name: gateway-tls
    namespace: twingate
  # configMapRef:
  #   name: gateway-ca
  #   namespace: twingate
