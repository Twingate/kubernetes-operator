apiVersion: twingate.com/v1beta
kind: TwingateResource
metadata:
  name: my-twingate-resource
  labels:
    env: dev
spec:
  name: My Resource
  address: my-resource.internal
  alias: my-resource.int
---
apiVersion: twingate.com/v1beta
kind: TwingateResource
metadata:
  name: my-k8s-resource
spec:
  type: Kubernetes
  name: My K8S Cluster
  address: kubernetes.default.svc.cluster.local
  alias: k8s-cluster.int
  gatewayRef:
    name: example-gateway
---
apiVersion: twingate.com/v1beta
kind: TwingateResource
metadata:
  name: my-web-app-resource
spec:
  type: WebApp
  name: My Web App
  address: web-app.default.svc.cluster.local
  alias: web-app.int
  gatewayRef:
    name: example-gateway
  downstream:
    port: 80
    tlsMode: NONE
  upstream:
    port: 8080
    tlsMode: NONE
  requestHeaderRewrites:
    - name: Authorization
      value: "Bearer {{ jwt }}"
---
# Take the address from a load balancer that a controller provisions for an
# Ingress (or a `type: LoadBalancer` Service via `serviceRef`). The operator
# waits until `status.loadBalancer.ingress[0]` is set, and updates the Resource
# if the load balancer is recreated with a new hostname.
apiVersion: twingate.com/v1beta
kind: TwingateResource
metadata:
  name: my-alb-resource
  namespace: my-app
spec:
  name: My App
  alias: my-app.internal.example.com
  addressFrom:
    ingressRef:
      name: my-app
